<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dinex POS - Store Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Poppins:wght@600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#262b2e",
                        "surface-variant": "#e3e1e9",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#505f76",
                        "surface-container": "#eeedf4",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e9e7ef",
                        "secondary-fixed-dim": "#b7c8e1",
                        "background": "#faf8ff",
                        "on-secondary-fixed-variant": "#38485d",
                        "primary-container": "#1e3a8a",
                        "primary": "#00236f",
                        "inverse-on-surface": "#f1f0f7",
                        "outline-variant": "#c5c5d3",
                        "on-primary": "#ffffff",
                        "surface": "#faf8ff",
                        "tertiary-container": "#3c4144",
                        "on-tertiary": "#ffffff",
                        "on-background": "#1a1b21",
                        "outline": "#757682",
                        "on-tertiary-fixed": "#171c1f",
                        "secondary-container": "#d0e1fb",
                        "on-primary-fixed": "#00164e",
                        "on-secondary-fixed": "#0b1c30",
                        "tertiary-fixed": "#dfe3e7",
                        "surface-tint": "#4059aa",
                        "error": "#ba1a1a",
                        "surface-dim": "#dad9e1",
                        "on-primary-container": "#90a8ff",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#54647a",
                        "on-surface-variant": "#444651",
                        "surface-container-highest": "#e3e1e9",
                        "on-error": "#ffffff",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed-variant": "#264191",
                        "surface-bright": "#faf8ff",
                        "inverse-surface": "#2f3036",
                        "inverse-primary": "#b6c4ff",
                        "surface-container-low": "#f4f3fa",
                        "secondary-fixed": "#d3e4fe",
                        "primary-fixed": "#dce1ff",
                        "on-tertiary-container": "#a8adb1",
                        "tertiary-fixed-dim": "#c3c7cb",
                        "on-tertiary-fixed-variant": "#43474b",
                        "on-surface": "#1a1b21"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xxl": "48px",
                        "sm": "8px",
                        "container-padding": "32px",
                        "xs": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "xl": "32px",
                        "unit": "4px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "body-sm": ["Inter"],
                        "headline-md": ["Poppins"],
                        "body-base": ["Inter"],
                        "title-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-lg": ["Poppins"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-base": ["16px", { "lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400" }],
                        "title-sm": ["18px", { "lineHeight": "1.5", "letterSpacing": "0", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "display-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-lg font-body-base text-body-base">
<!-- Store Selection Card Container -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0px_4px_20px_rgba(30,58,138,0.05)] border border-surface-variant w-full max-w-md p-xl flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-sm">
<div class="mx-auto w-16 h-16 bg-primary-container rounded-lg flex items-center justify-center mb-sm shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]">storefront</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Select Store to Continue</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Choose a location to access its POS dashboard.</p>
</div>
<!-- Store List -->
<div class="flex flex-col gap-md">
<!-- Store Card 1 (Main Branch) -->
<button class="w-full group text-left bg-surface rounded-lg border border-outline-variant p-md hover:border-primary-container hover:bg-surface-container-low transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 flex items-center justify-between">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined">domain</span>
</div>
<div>
<h2 class="font-title-sm text-title-sm text-on-surface group-hover:text-primary-container transition-colors">Dinex 1</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Main Branch</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
<!-- Store Card 2 (Downtown) -->
<button class="w-full group text-left bg-surface rounded-lg border border-outline-variant p-md hover:border-primary-container hover:bg-surface-container-low transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 flex items-center justify-between">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:bg-primary-container group-hover:text-on-primary transition-colors">
<span class="material-symbols-outlined">store</span>
</div>
<div>
<h2 class="font-title-sm text-title-sm text-on-surface group-hover:text-primary-container transition-colors">Dinex 2</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant">Downtown</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
</div>
<!-- Footer / Extra Toggle -->
<div class="flex items-center justify-between pt-md border-t border-surface-variant mt-sm">
<label class="flex items-center gap-sm cursor-pointer select-none" for="remember-store">
<div class="relative flex items-center">
<input class="peer sr-only" id="remember-store" type="checkbox"/>
<div class="w-10 h-6 bg-surface-variant rounded-full peer peer-checked:bg-primary-container transition-colors duration-200 ease-in-out"></div>
<div class="absolute left-1 top-1 w-4 h-4 bg-surface-container-lowest rounded-full transition-transform duration-200 ease-in-out peer-checked:translate-x-4 shadow-sm"></div>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant">Remember last selected store</span>
</label>
</div>
</div>
</body></html>
